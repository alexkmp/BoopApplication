plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.boop.keycloak'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springBootVersion = '4.0.6'
	openApiVersion = '3.0.2'
	grpcStarterVersion = '3.1.0.RELEASE'
	logbackVersion = '7.4'
	keycloakCoreVersion = '26.6.1'
	keycloakAdminClientVersion = '26.0.9'
	jakartaValidationApiVersion = '3.0.1'
	hibernateValidatorVersion = '7.0.2.Final'

}

dependencies {
	implementation project(':boop-api')

	implementation "org.keycloak:keycloak-core:${keycloakCoreVersion}"
	implementation "org.keycloak:keycloak-admin-client:${keycloakAdminClientVersion}"

	implementation group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-aarch_64'

	implementation "net.logstash.logback:logstash-logback-encoder:${logbackVersion}"

	implementation "net.devh:grpc-server-spring-boot-starter:${grpcStarterVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-zipkin'

	implementation "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
	implementation "org.hibernate:hibernate-validator:${hibernateValidatorVersion}"

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
