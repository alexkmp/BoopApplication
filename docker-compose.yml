services:
  zipkin-server:
    image: openzipkin/zipkin
#    restart: always
    mem_limit: 1024m
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "9411:9411"

  postgres:
    image: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_statement=none", "-c", "log_min_duration_statement=1000", "-c", "log_connections=on", "-c", "log_disconnections=on" ]
    volumes:
      - $PWD/postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - $PWD/postgres/init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - $PWD/postgres/pg_volume:/var/lib/postgresql:rw

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - $PWD/redis/data:/data
      - $PWD/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: sh -c 'redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    sysctls:
      - net.core.somaxconn=65535

  keycloak:
    image: keycloak/keycloak
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=${KC_HOSTNAME_BACKCHANNEL_DYNAMIC}
    command: [
      "start-dev",
#      "--import-realm"
      "-Dkeycloak.migration.action=export",
      "-Dkeycloak.migration.provider=singleFile",
      "-Dkeycloak.migration.usersExportStrategy=REALM_FILE",
      "-Dkeycloak.migration.file=/tmp/export/realms-export.json"
    ]
    volumes:
      - $PWD/keycloak/realms/data/import:/opt/keycloak/data/import
      - $PWD/keycloak/realms/data/export:/tmp/export

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_ENABLE_KRAFT: yes
    volumes:
      - $PWD/kafka/1/data:/var/lib/kafka/data

  kafka2:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9094:9092"
      - "9095:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka2:9092,CONTROLLER://kafka2:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_ENABLE_KRAFT: yes
    volumes:
      - $PWD/kafka/2/data:/var/lib/kafka/data

  kafka3:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9096:9092"
      - "9097:9093"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_BROKER_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka3:9092,CONTROLLER://kafka3:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka3:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_ENABLE_KRAFT: yes
    volumes:
      - $PWD/kafka/3/data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8082:8081"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - $PWD/es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    ports:
      - "5044:5044"
    volumes:
      - $PWD/config-rep/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch

  owners:
    build: boop-pet-owners
    image: owner-domain/boop-pet-owners
    container_name: boop-pet-owners
    mem_limit: 512m
    environment:
        - LOGGING_CONFIG=/config-rep/logback.xml
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_CONFIG_LOCATION=file:/config-rep/application.yml,file:/config-rep/boop-pet-owners.yml
        - POSTGRES_PASSWORD=${POSTGRES_PET_OWNER_PASSWORD}
        - POSTGRES_USER=${POSTGRES_PET_OWNER_USER}
        - POSTGRES_DB=${POSTGRES_DATABASE_PET_OWNER}
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - KEYCLOAK_OAUTH_CLIENT_ID=${KEYCLOAK_OAUTH_CLIENT_ID}
        - KEYCLOAK_OAUTH_CLIENT_SECRET=${KEYCLOAK_OAUTH_CLIENT_SECRET}
    volumes:
      - $PWD/config-rep:/config-rep
    depends_on:
      - keycloak
      - postgres

  specialists:
    build: boop-pet-specialists
    image: specialist-domain/boop-pet-specialists
    container_name: boop-pet-specialists
    mem_limit: 512m
    environment:
      - LOGGING_CONFIG=/config-rep/logback.xml
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-rep/application.yml,file:/config-rep/boop-pet-specialists.yml
      - POSTGRES_PASSWORD=${POSTGRES_PET_SPECIALIST_PASSWORD}
      - POSTGRES_USER=${POSTGRES_PET_SPECIALIST_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE_PET_SPECIALIST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KEYCLOAK_OAUTH_CLIENT_ID=${KEYCLOAK_OAUTH_CLIENT_ID}
      - KEYCLOAK_OAUTH_CLIENT_SECRET=${KEYCLOAK_OAUTH_CLIENT_SECRET}
    volumes:
      - $PWD/config-rep:/config-rep
    depends_on:
      - keycloak
      - postgres

  service-marketplace:
    build: boop-service-marketplace
    image: service-marketplace-domain/boop-service-marketplace
    container_name: boop-service-marketplace
    mem_limit: 512m
    environment:
      - LOGGING_CONFIG=/config-rep/logback.xml
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-rep/application.yml,file:/config-rep/boop-service-marketplace.yml
      - POSTGRES_PASSWORD=${POSTGRES_SERVICE_MARKETPLACE_PASSWORD}
      - POSTGRES_USER=${POSTGRES_SERVICE_MARKETPLACE_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE_SERVICE_MARKETPLACE}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - $PWD/config-rep:/config-rep
    depends_on:
      - postgres

  gateway:
    build: boop-gateway
    image: boop-gateway
    container_name: boop-gateway
    mem_limit: 512m
    ports:
      - "8443:8443"
    environment:
      - LOGGING_CONFIG=/config-rep/logback.xml
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_SSL_KEY_STORE=file:/keystore/boop-cert.p12
      - SPRING_CONFIG_LOCATION=file:/config-rep/application.yml,file:/config-rep/boop-gateway.yml
      - SERVER_SSL_KEY_STORE_PASSWORD=${SSL_KEY_STORE_PASSWORD}
      - CONFIG_SERVER_USR=${CONFIG_SERVER_USR}
      - CONFIG_SERVER_PWD=${CONFIG_SERVER_PWD}
      - KEYCLOAK_OAUTH_CLIENT_ID=${KEYCLOAK_OAUTH_CLIENT_ID}
      - KEYCLOAK_OAUTH_CLIENT_SECRET=${KEYCLOAK_OAUTH_CLIENT_SECRET}
    volumes:
        - $PWD/keystore:/keystore
        - $PWD/config-rep:/config-rep
    depends_on:
      - keycloak

  keycloak-admin:
    build: boop-keycloak-admin
    image: boop-keycloak-admin
    container_name: boop-keycloak-admin
    mem_limit: 512m
    environment:
      - LOGGING_CONFIG=/config-rep/logback.xml
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_LOCATION=file:/config-rep/application.yml,file:/config-rep/boop-keycloak-admin.yml
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - KEYCLOAK_APPLICATION_CLIENT_UUID=${KEYCLOAK_APPLICATION_CLIENT_UUID}
    volumes:
      - $PWD/config-rep:/config-rep
    depends_on:
      - keycloak