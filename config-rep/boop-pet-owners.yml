server.port: 8081

spring:
  application:
    name: boop-pet-owners
  http:
    codec:
      log-request-details: true
  datasource:
    url: jdbc:postgresql://${db.host}:5432/${POSTGRES_DB}?sslmode=disable
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.xml
  info:
    developer:
      name: Alex Kumpel
      email: deathkid777@gmail.com
    api:
      version: 1.0
grpc:
  client:
    keycloakAdmin:
      address: static://keycloak-admin:9090
      negotiationType: plaintext

