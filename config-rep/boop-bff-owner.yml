server.port: 8081

spring:
  application:
    name: boop-bff-owner
  http:
    codec:
      log-request-details: true
  info:
    developer:
      name: Alex Kumpel
      email: deathkid777@gmail.com
    api:
      version: 1.0
reactor:
    context-propagation: enabled
grpc:
  client:
    keycloakAdmin:
      address: static://keycloak-admin:9090
      negotiationType: plaintext

#resilience4j:
