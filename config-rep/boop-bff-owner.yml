#    metrics:
#      legacy:
#        enabled: true
#    enabled: true

management:
  endpoints:
    web:
      base-path: /bff-owner-actuator
      exposure:
        include: "*"
  endpoint:
    configprops:
      show-values: always
    health:
      show-details: always
      status:
        order: events-down, fatal, down, out-of-service, unknown, up
    shutdown:
      enabled: true
    info:
      env:
        enabled: true

db.host: localhost

jwt:
  auth:
    converter:
      resource-id: boop-application-client
      principle-attribute: preferred_username

logging:
  level:
#    org.springframework.security: TRACE
#    org.springframework.web: TRACE
#    org.springframework.boot.autoconfigure: INFO

springdoc:
  packages-to-scan: com.boop.owners, com.boop.bff.owner
  paths-to-match: /**
  cache.disabled: true
  api-docs:
    path: /bff-owner/openapi/v3/api-docs
  swagger-ui:
    enabled: true
    path: /bff-owner/openapi/swagger-ui.html
    oauth:
      clientId: ${KEYCLOAK_OAUTH_CLIENT_ID}
      clientSecret: ${KEYCLOAK_OAUTH_CLIENT_SECRET}
  oAuthFlow:
    authorizationUrl: http://${keycloak.host}:8080/realms/${keycloak.realm}/protocol/openid-connect/auth
    tokenUrl: http://${keycloak.host}:8080/realms/${keycloak.realm}/protocol/openid-connect/token

---
spring.config.activate.on-profile: docker
server.port: 80

---
spring.config.activate.on-profile: prod